# application-eks.yml
#
# AWS EKS profile (AIAE shared DEV/PROD clusters). Activated by the Helm chart
# via SPRING_PROFILES_ACTIVE=eks.
#
# Environment-specific values (origins, ports, feature flags) come from the
# ConfigMap rendered by AIAE-helm; secrets arrive from AWS Secrets Manager
# through the Secrets Store CSI driver. Nothing environment-specific belongs
# in this file — it is shared by DEV and PROD.

spring:
  liquibase:
    # Schema migration runs as an Argo CD PreSync Job from the paired
    # liquibase-* image BEFORE any new pod rolls out, so the application must
    # never migrate on startup. With multiple replicas, startup migration would
    # also race between pods on the same changelog lock.
    enabled: false

  jpa:
    # The PreSync Job owns the schema, so the runtime only validates that the
    # mapped entities match what the migration produced. A mismatch must fail
    # startup loudly rather than be silently tolerated.
    hibernate:
      ddl-auto: validate

  datasource:
    # Database credentials for this profile come from the RDS-managed master
    # user secret, and nothing copies them anywhere else. The AWS Advanced JDBC
    # Wrapper's awsSecretsManager plugin reads that secret through the pod's
    # IRSA role when it opens a connection. AWS rotates the password every
    # seven days; when PostgreSQL then rejects a login, the plugin refetches
    # the secret and retries the connection, so the rotation never surfaces.
    #
    # Projecting the password into an environment variable cannot work here.
    # Environment variables are fixed for the lifetime of a container, while
    # the pool retires connections within a minute (idle-timeout below), so a
    # rotated password starts failing about a minute after the rotation and
    # keeps failing until something restarts the pod.
    url: jdbc:aws-wrapper:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    driver-class-name: software.amazon.jdbc.Driver

    # Deliberately empty: the plugin supplies both from the secret's username
    # and password fields. Inheriting the base profile's POSTGRES_USER and
    # POSTGRES_PASSWORD instead would let a misconfigured plugin fall back to
    # stale or default credentials and connect anyway; an empty credential
    # fails the connection loudly, which is the behaviour this profile wants.
    username: ""
    password: ""

    hikari:
      # Forwarded to the driver as connection properties, which is how the
      # wrapper is configured.
      data-source-properties:
        # This plugin only. The wrapper's default plugin list targets Aurora
        # failover topology, which a single-instance RDS deployment has not
        # got.
        wrapperPlugins: awsSecretsManager
        wrapperDialect: rds-pg
        # ARN of the RDS-managed secret, supplied by the chart's ConfigMap from
        # the Terraform output onboarding_database_master_secret_arn. An ARN is
        # not itself a secret.
        secretsManagerSecretId: ${DB_MASTER_SECRET_ID}
        secretsManagerRegion: ${AWS_REGION:us-east-1}

server:
  # The browser origin is CloudFront, which forwards to an ALB; both append
  # X-Forwarded-*. Without this, Spring builds absolute URLs (redirects, CORS
  # pre-flight, Swagger) from the internal http://pod:5000 address instead of
  # the public https origin. Also set in the base config; repeated here because
  # correct behaviour behind two proxies is a hard requirement of this profile.
  forward-headers-strategy: framework

management:
  health:
    # Exposes /actuator/health/readiness and /actuator/health/liveness, which
    # the chart's startup/readiness/liveness probes and the ALB target-group
    # health check depend on. The chart also sets this via
    # MANAGEMENT_HEALTH_PROBES_ENABLED; kept here so the profile is correct
    # even if the ConfigMap entry is ever dropped.
    probes:
      enabled: true
