# docker-compose.yml — local-dev only. Profile `local` brings up
# PostgreSQL + backend + frontend so the full stack runs without Replit.
#
# Usage:
#   docker compose --profile local up --build -d
#   docker compose --profile local down -v
#
# All three services carry the `local` profile, as in the AIAE scaffold.
# Naming a service explicitly still starts it — `docker compose up -d postgres`
# for the scripts/local-dev-*.sh workflow (see README) keeps working.
#
# Production / Replit Deployment does NOT use this file. Replit runs
# `mvn package` + `java -jar` directly (see .replit [deployment]).

name: ai-onboarding-local

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      # Root context: backend/Dockerfile copies the whole `backend/` tree.
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["local"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # application-local.yml defaults server.port to 5000; the container and
      # the published port are both 8080, so pin it explicitly.
      PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      APP_CONTEXT_PATH: ${APP_CONTEXT_PATH:-}
      APP_SERVICE_NAME: ${APP_SERVICE_NAME:-aionboarding}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN:-aidigital.com}
      AUTH_AUTHORIZED_PARTIES: ${AUTH_AUTHORIZED_PARTIES:-http://localhost:5173,http://localhost:8080}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      USAGE_LOGGING_ENABLED: ${USAGE_LOGGING_ENABLED:-true}
      USAGE_LOG_SERVICE_NAME: ${USAGE_LOG_SERVICE_NAME:-aionboarding}
      USAGE_LOG_ENVIRONMENT: ${USAGE_LOG_ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080$${APP_CONTEXT_PATH:-}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s

  frontend:
    build:
      # Root context: frontend/Dockerfile also copies the backend OpenAPI spec.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
    profiles: ["local"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Substituted into nginx.conf.template's /api proxy target at startup.
      APP_CONTEXT_PATH: ${APP_CONTEXT_PATH:-}
    ports:
      - "127.0.0.1:5173:80"

volumes:
  local-postgres-data:
